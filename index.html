<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قهوه و دانه ☕</title>
    <!-- Import Vazirmatn (Persian Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Reset & Base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: #f8f2e7;
            color: #3e2723;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #fefbf7;
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(62, 39, 35, 0.15);
            border: 1px solid #e8ddd0;
        }

        /* --- Header --- */
        .shop-header {
            text-align: center;
            border-bottom: 2px dashed #d7ccc8;
            padding-bottom: 25px;
            margin-bottom: 30px;
        }
        .shop-header h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #4e342e;
        }
        .shop-header h1 span {
            color: #a1887f;
        }
        .shop-header p {
            color: #795548;
            font-style: italic;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* --- BIG CATEGORY BOXES (Grid Layout) --- */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .category-card {
            background: #fcf8f5;
            border: 3px solid #e8ddd0;
            border-radius: 24px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(62, 39, 35, 0.12);
            border-color: #bcaaa4;
        }
        /* Active state (selected category) */
        .category-card.active {
            background: #4e342e;
            border-color: #4e342e;
            color: #fff !important;
            box-shadow: 0 12px 30px rgba(62, 39, 35, 0.25);
        }
        .category-card.active .cat-icon {
            filter: brightness(10);
        }
        .category-card.active .cat-title {
            color: #fff;
        }
        .category-card.active .cat-sub {
            color: #d7ccc8;
        }

        .cat-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }
        .cat-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #4e342e;
            display: block;
        }
        .cat-sub {
            font-size: 0.9rem;
            color: #8d6e63;
            display: block;
            margin-top: 4px;
        }

        /* --- Menu Items Display Area --- */
        .items-section {
            background: #fffcf9;
            border-radius: 20px;
            padding: 25px 20px;
            border: 1px solid #efebe9;
            min-height: 200px;
        }
        .items-section .section-title {
            font-size: 1.8rem;
            color: #5d4037;
            border-right: 6px solid #8d6e63;
            padding-right: 15px;
            margin-bottom: 25px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px solid #efebe9;
        }
        .menu-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding-left: 15px;
        }
        .item-name {
            font-weight: 600;
            font-size: 1.2rem;
            color: #3e2723;
        }
        .item-desc {
            font-size: 0.9rem;
            color: #8d6e63;
            margin-top: 2px;
        }
        .item-price {
            font-weight: 700;
            font-size: 1.2rem;
            color: #4e342e;
            white-space: nowrap;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            color: #bcaaa4;
            padding: 30px 0;
            font-size: 1.2rem;
        }

        /* --- Footer --- */
        .footer {
            text-align: center;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 2px dashed #d7ccc8;
            color: #8d6e63;
            font-size: 0.95rem;
        }

        /* --- Responsive --- */
        @media (max-width: 550px) {
            .container { padding: 20px 15px; }
            .shop-header h1 { font-size: 2.2rem; }
            .categories-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .category-card { padding: 18px 10px; }
            .cat-icon { font-size: 2.2rem; }
            .cat-title { font-size: 1.2rem; }
            .menu-item { flex-wrap: wrap; }
            .item-price { margin-top: 5px; }
        }
        @media (max-width: 400px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="shop-header">
            <h1>قهوه و <span>دانه</span></h1>
            <p>☕ طعم‌های تازه، هر روز</p>
        </header>

        <!-- Big Category Boxes (will be generated by JS) -->
        <div class="categories-grid" id="categoryContainer">
            <!-- JS will fill this -->
        </div>

        <!-- Items Display Area -->
        <div class="items-section" id="itemsContainer">
            <!-- JS will fill this -->
        </div>

        <!-- Footer -->
        <div class="footer">
            ⏰ شنبه تا پنجشنبه: ۷ تا ۱۸ &nbsp;|&nbsp; جمعه: ۸ تا ۱۶
            <br>
            <span style="font-size: 0.8rem;">تمامی قیمت‌ها به تومان</span>
        </div>
    </div>

    <script>
        // --- Data: Menu Items by Category ---
        const menuData = [
            // Category 1: Hot Drinks
            {
                id: 'hot',
                icon: '☕',
                title: 'بار گرم',
                subtitle: 'اسپرسو، کاپوچینو و لاته',
                items: [
                    { name: 'اسپرسو', desc: 'طعم غنی و اصیل، تک‌دانه', price: '۳۵,۰۰۰' },
                    { name: 'آمریکانو', desc: 'اسپرسو با آب داغ', price: '۴۰,۰۰۰' },
                    { name: 'کاپوچینو', desc: 'ترکیب متعادل اسپرسو، شیر و کف', price: '۵۵,۰۰۰' },
                    { name: 'لاته', desc: 'اسپرسوی نرم با شیر بخار لطیف', price: '۵۵,۰۰۰' },
                    { name: 'موکا', desc: 'اسپرسو، شکلات و شیر بخار', price: '۶۰,۰۰۰' }
                ]
            },
            // Category 2: Cold Drinks
            {
                id: 'cold',
                icon: '🧊',
                title: 'بار سرد',
                subtitle: 'نوشیدنی‌های یخی و گوارا',
                items: [
                    { name: 'کولد برو', desc: 'دم‌آوری سرد ۱۲ ساعته', price: '۵۰,۰۰۰' },
                    { name: 'لاته یخ', desc: 'لاته سرد با یخ و شیر تازه', price: '۶۰,۰۰۰' },
                    { name: 'فراپه', desc: 'اسپرسو، یخ و خامه فرم گرفته', price: '۷۰,۰۰۰' },
                    { name: 'لیموناد نعنا', desc: 'آبلیموی تازه با نعنا و یخ', price: '۴۵,۰۰۰' }
                ]
            },
            // Category 3: Breakfast
            {
                id: 'breakfast',
                icon: '🍳',
                title: 'صبحانه',
                subtitle: 'شروع روز با انرژی',
                items: [
                    { name: 'املت سبزیجات', desc: 'تخم‌مرغ، قارچ، فلفل و گوجه', price: '۸۵,۰۰۰' },
                    { name: 'کروسان تخم‌مرغ', desc: 'کروسان کره‌ای با تخم‌مرغ و پنیر', price: '۷۵,۰۰۰' },
                    { name: 'تست کره و مربا', desc: 'نان تست تازه با کره و مربای خانگی', price: '۵۰,۰۰۰' },
                    { name: 'کیش سبزیجات', desc: 'پای شور با اسفناج و پنیر فتا', price: '۹۰,۰۰۰' }
                ]
            },
            // Category 4: Pastries & Desserts
            {
                id: 'dessert',
                icon: '🍰',
                title: 'شیرینی و دسر',
                subtitle: 'طعم‌های شیرین و خاص',
                items: [
                    { name: 'دانمارکی بادامی', desc: 'خمیر پوسته‌پوسته با خامه بادام', price: '۵۰,۰۰۰' },
                    { name: 'مافین بلوبری', desc: 'بلوبری تازه با رویه شکر', price: '۴۷,۵۰۰' },
                    { name: 'کیک شکلاتی', desc: 'کیک مرطوب با گاناش شکلات تلخ', price: '۵۵,۰۰۰' }
                ]
            }
        ];

        // --- DOM Elements ---
        const categoryContainer = document.getElementById('categoryContainer');
        const itemsContainer = document.getElementById('itemsContainer');

        // --- Functions ---

        // Render Category Boxes
        function renderCategories() {
            categoryContainer.innerHTML = '';
            menuData.forEach((cat, index) => {
                const card = document.createElement('div');
                card.className = 'category-card';
                // Set first category as active by default
                if (index === 0) card.classList.add('active');
                
                card.innerHTML = `
                    <span class="cat-icon">${cat.icon}</span>
                    <span class="cat-title">${cat.title}</span>
                    <span class="cat-sub">${cat.subtitle}</span>
                `;
                
                card.addEventListener('click', () => {
                    // Remove 'active' class from all cards
                    document.querySelectorAll('.category-card').forEach(c => c.classList.remove('active'));
                    // Add 'active' to clicked card
                    card.classList.add('active');
                    // Show items for this category
                    renderItems(cat.id);
                });
                
                categoryContainer.appendChild(card);
            });
        }

        // Render Items for a specific category
        function renderItems(categoryId) {
            const category = menuData.find(c => c.id === categoryId);
            if (!category) return;

            // Clear container
            itemsContainer.innerHTML = '';

            // Create section title
            const title = document.createElement('h2');
            title.className = 'section-title';
            title.textContent = category.title;
            itemsContainer.appendChild(title);

            // Create items
            if (category.items.length === 0) {
                itemsContainer.innerHTML += `<div class="empty-state">⏳ موردی یافت نشد</div>`;
                return;
            }

            category.items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-desc">${item.desc}</span>
                    </div>
                    <span class="item-price">${item.price}</span>
                `;
                itemsContainer.appendChild(itemDiv);
            });
        }

        // --- Initialize Page ---
        function init() {
            renderCategories();
            // Show the first category's items by default
            if (menuData.length > 0) {
                renderItems(menuData[0].id);
            }
        }

        // Run on page load
        init();
    </script>
</body>
</html>
